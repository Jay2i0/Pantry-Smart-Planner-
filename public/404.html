<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Pantry Smart Planner</title>
    <script>
        // Redirect 404s to index.html for SPA routing
        var pathSegmentsToKeep = 1;
        var l = window.location;
        l.replace(
            l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
            '/Pantry-Smart-Planner-/' +
            l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/') +
            (l.search ? '?' + l.search.slice(1) : '') +
            (l.hash ? '#' + l.hash.slice(1) : '')
        );
    </script>
</head>
<body>
</body>
</html>
